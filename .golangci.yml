version: "2"
linters:
  default: none
  enable:
    - bodyclose
    - dupl
    - errcheck
    - gocritic
    - gocyclo
    - godot
    - govet
    - ineffassign
    - mnd
    - prealloc
    - revive
    - staticcheck
    - unparam
    - unused
  settings:
    gocyclo:
      min-complexity: 20
    mnd:
      ignored-numbers:
        - "0"
        - "1"
        - "2"
        - "3"
    revive:
      rules:
        - name: package-comments
          disabled: true
    testpackage:
      skip-regexp: .*
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
    rules:
      # TUI layout is sized in cells and key handling is one switch per
      # view; magic-number and complexity checks are noise there.
      - path: internal/tui/
        linters: [mnd, gocyclo]
      - path: _test\.go
        linters: [gocyclo, prealloc]
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  settings:
    gofmt:
      simplify: false
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
