version: 2
project_name: jt

release:
  prerelease: auto
  name_template: "v{{.Version}}"
  draft: true
  mode: "keep-existing"

before:
  hooks:
    - go mod tidy

builds:
  - <<: &build_defaults
      binary: bin/jt
      main: ./cmd/jt
      ldflags:
        - -s -w
        - -X github.com/aakara-dev/jt/internal/version.Version={{.Version}}
        - -X github.com/aakara-dev/jt/internal/version.GitCommit={{.FullCommit}}
        - -X github.com/aakara-dev/jt/internal/version.SourceDateEpoch={{.CommitTimestamp}}
      env:
        - CGO_ENABLED=0
    id: macOS
    goos: [darwin]
    goarch: [amd64, arm64]

  - <<: *build_defaults
    id: linux
    goos: [linux]
    goarch: [386, arm, amd64, arm64]

  - <<: *build_defaults
    id: windows
    goos: [windows]
    goarch: [amd64]

archives:
  - id: nix
    ids: [macOS, linux]
    <<: &archive_defaults
      name_template: >-
        {{ .ProjectName }}_{{ .Version }}_{{- if eq .Os "darwin" }}macOS{{- else }}{{ .Os }}{{- end }}_{{- if eq .Arch "amd64" }}x86_64{{- else if eq .Arch "386" }}i386{{- else }}{{ .Arch }}{{- end }}{{- if .Arm }}v{{ .Arm }}{{ end -}}
    wrap_in_directory: true
    formats: [tar.gz]
    files:
      - LICENSE

  - id: windows
    ids: [windows]
    <<: *archive_defaults
    wrap_in_directory: false
    formats: [zip]
    files:
      - LICENSE

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

brews:
  - name: jt
    homepage: "https://github.com/aakara-dev/jt"
    description: "Keyboard-driven Jira Server/Data Center TUI and CLI"
    license: "MIT"

    ids:
      - nix

    repository:
      owner: aakara-dev
      name: homebrew-tap

    custom_block: |
      head do
        url "https://github.com/aakara-dev/jt.git", branch: "main"
        depends_on "go"
      end

    install: |
      if build.head?
        system "make", "install"
        bin.install ENV["GOPATH"] + "/bin/jt"
      else
        bin.install File.exist?("bin/jira") ? "bin/jt" : "jt"
      end
      generate_completions_from_executable(bin/"jt", "completion", shells: [:bash, :zsh, :fish])

    test: |
      help_text = shell_output("#{bin}/jt version")
      assert_includes help_text, "Version=\"#{version}\""

    commit_author:
      name: aakara-dev
      email: aakara.dev@gmail.com

    commit_msg_template: "Formula update for version {{ .Tag }}"

    # Folder inside the repository to put the formula to.
    directory: Formula

    # This will prevent goreleaser to actually try to commit the updated
    # formula - leaving the responsibility of publishing it to the user.
    skip_upload: true

changelog:
  disable: true
  use: github
  sort: desc
  filters:
    exclude:
      - '^doc:'
      - '^dev:'
      - '^build:'
      - '^ci:'
